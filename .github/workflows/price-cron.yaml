name: Price cron

on:
  schedule:
    - cron: "0 5,17 * * *"  # 08:00 and 20:00 Istanbul (cron runs in UTC)
  workflow_dispatch:        # "Run workflow" button for manual runs

concurrency:
  group: price-cron
  cancel-in-progress: false

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}